<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121211">
  <title>Desk Robot Remote</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/assistant.css">
  <style>
    body { min-height: 100dvh; }
    .remote { max-width: 460px; margin: 0 auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
    .r-top { display: flex; align-items: center; gap: 12px; }
    .r-top .as-face svg { width: 64px; height: 48px; }
    .r-status { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); }
    .r-status b { color: var(--ink); font-weight: 600; }
    .r-reply { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-height: 64px; }
    .r-reply .you { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; overflow-wrap: anywhere; }
    .r-reply .bot { font-size: 16px; overflow-wrap: anywhere; }
    .r-reply .turn-meta { margin-top: 6px; }
    .r-pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 76px); gap: 8px;
             grid-template-areas: ". up ." "left stop right" ". down ."; }
    .r-pad .dpad-btn { touch-action: none; user-select: none; -webkit-user-select: none; }
    .r-pad .dpad-btn svg { width: 30px; height: 30px; }
    .r-pad .dpad-stop { font-size: 14px; }
    .r-talk { display: flex; gap: 10px; align-items: center; }
    .r-talk .talk-btn { flex: 1; justify-content: center; padding: 16px; font-size: 16px; }
    .r-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .r-actions button { padding: 10px 4px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--card); cursor: pointer; font-size: 13px; }
    .r-actions button:active { background: var(--move-soft); }
    .r-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-3); gap: 8px; flex-wrap: wrap; }
    .r-foot a { color: var(--ink-2); }
    .r-alert { padding: 8px 10px; border-radius: 7px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  </style>
</head>
<body>
  <main class="remote">
    <div class="r-top">
      <div class="as-face" id="r-face" data-mood="neutral">
        <svg viewBox="0 0 64 48" aria-hidden="true">
          <rect class="face-bg" x="2" y="2" width="60" height="44" rx="12"/>
          <g class="eyes"><ellipse class="eye" cx="22" cy="20" rx="5" ry="6"/><ellipse class="eye" cx="42" cy="20" rx="5" ry="6"/></g>
          <path class="mouth" d="M22 32 Q32 40 42 32"/>
        </svg>
      </div>
      <div class="r-status" id="r-status"><b>Connecting…</b></div>
    </div>

    <div class="r-alert" id="r-alert" hidden></div>

    <div class="r-reply" aria-live="polite">
      <div class="you" id="r-you"></div>
      <div class="bot" id="r-bot">Hold a direction to drive. Hold the mic to talk.</div>
      <div class="turn-meta" id="r-meta"></div>
    </div>

    <div class="r-pad" role="group" aria-label="Drive">
      <button class="dpad-btn" data-dir="forward" style="grid-area: up" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="dpad-btn" data-dir="left" style="grid-area: left" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="dpad-btn dpad-stop" id="r-stop" style="grid-area: stop" aria-label="Stop everything">Stop</button>
      <button class="dpad-btn" data-dir="right" style="grid-area: right" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="dpad-btn" data-dir="backward" style="grid-area: down" aria-label="Backward"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>

    <div class="r-talk">
      <button class="talk-btn" id="talk-btn" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="talk-label">Hold to talk</span>
      </button>
      <div class="level" aria-hidden="true"><i id="talk-level"></i></div>
    </div>
    <p class="as-note" id="as-insecure" hidden>The microphone needs HTTPS: <a id="as-https-link" href="#">open the secure remote</a> (accept the certificate warning once).</p>

    <form class="as-input" id="as-form" autocomplete="off" style="margin-top:0">
      <input type="text" id="as-text" maxlength="500" placeholder="Type to the robot…">
      <button type="submit" class="btn-primary" id="as-send">Send</button>
    </form>

    <div class="r-actions">
      <button data-cmd="spin">🌀 Spin</button>
      <button data-cmd="dance">💃 Dance</button>
      <button data-cmd="look_around">👀 Look around</button>
      <button data-cmd="face_user">🙂 Face me</button>
      <button data-cmd="find_phone">📱 Find phone</button>
      <button data-cmd="sleep" id="r-sleep">😴 Sleep</button>
    </div>

    <div class="r-foot">
      <label class="switch"><input type="checkbox" id="r-play"><span>Play replies on this phone</span></label>
      <a href="/">Full dashboard</a>
    </div>
  </main>
  <script src="/static/voice-recorder.js"></script>
  <script src="/static/remote.js"></script>
</body>
</html>
